# @package _global_
model:
  class_name: FusionLSTMModel_v2
  type: fusion_lstm
  
  params:
    # Model architecture parameters
    img_dim: ${dataset.hidden_feature_dim}
    action_dim: ${dataset.image_embedding_dim}
    lstm_hidden_dim: 64
    gate_hidden_dim: 32
    use_gate: true  # Enable adaptive learnable weights
    output_dim: 1

