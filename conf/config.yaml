defaults:
  - model: lstm_img
  - dataset: open_pi0_simpler_fractal

# Training hyperparameters
training:
  n_epochs: 100
  batch_size: 64
  learning_rate: 0.00001
  lambda_reg: 0.01
  use_scheduler: false
  save_best_model: false
  normalize_hidden_states: true
# Optimizer configuration
optimizer:
  type: Adam  # Adam, AdamW, SGD
  lr: ${training.learning_rate}
  weight_decay: 0.0

# Scheduler configuration
scheduler:
  type: CosineAnnealingLR  #CosineAnnealingLR, StepLR, None
  T_max: ${training.n_epochs} #for cosine annealing scheduler
  eta_min: 1e-4 #for cosine annealing scheduler
  #patience: 10 
  #factor: 0.5
  #min_lr: 1e-4
# Experiment tracking
wandb:
  project: architecture_comparison
  group: null  # Will be set automatically or can be overridden
  name: null   # Will be set automatically or can be overridden
  enabled: false

# Random seed
seed: 1