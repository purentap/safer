defaults:
  - model: fusion_lstmv2
  - dataset: openvla
  - _self_

# Random seed
seed: 0
data_root: ${dataset.path}

# visualization:
#   output_dir: visualizations
#   stride: 1
#   perplexity: 30
#   point_size: 1.0

# Training hyperparameters
training:
  n_epochs: 500
  batch_size: 64
  learning_rate: 1e-4
  lambda_reg: 1e-3
  use_scheduler: false
  save_best_model: true
  normalize_hidden_states: true
# Optimizer configuration
optimizer:
  type: Adam  # Adam, AdamW, SGD
  lr: ${training.learning_rate}
  weight_decay: 0.0

checkpoint:
  enabled: true
  filename: best_model.pth
  path: ./checkpoints
  
# Scheduler configuration
scheduler:
  type: CosineAnnealingLR  #CosineAnnealingLR, StepLR, None
  T_max: ${training.n_epochs} #for cosine annealing scheduler
  eta_min: 1e-4 #for cosine annealing scheduler
  #patience: 10 
  #factor: 0.5
  #min_lr: 1e-4
# Experiment tracking
wandb:
  enabled: true
  project: temp
  group: null  # Will be set automatically or can be overridden
  run: null  # Will be set automatically or can be overridden
